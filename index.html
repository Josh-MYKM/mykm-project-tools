<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MYKM Project Tools</title>
</head>

<body>

<script src="https://p.trellocdn.com/power-up.min.js"></script>

<script>
window.TrelloPowerUp.initialize({

  'show-settings': function(t, options) {
    return t.popup({
      title: 'MYKM Project Tools Settings',
      url: './settings.html',
      height: 700
    });
  },


  'card-buttons': function(t, options) {

    return t.card('attachments')
      .then(function(card) {

        var attachments = card.attachments || [];

        var cutlistAttachment = null;
        var folderAttachment = null;


        attachments.forEach(function(attachment) {

          var name =
            String(attachment.name || '')
              .toLowerCase();

          var url =
            String(attachment.url || '')
              .toLowerCase();


          /*
           * Find Google Sheets SM Cutlist.
           */
          if (
            !cutlistAttachment &&
            (
              name.indexOf('sm cutlist') !== -1 ||
              (
                url.indexOf(
                  'docs.google.com/spreadsheets/'
                ) !== -1 &&
                name.indexOf('cutlist') !== -1
              )
            )
          ) {
            cutlistAttachment = attachment;
          }


          /*
           * Find Google Drive Project Folder.
           */
          if (
            !folderAttachment &&
            (
              name === 'project folder' ||
              (
                url.indexOf(
                  'drive.google.com/drive/folders/'
                ) !== -1
              )
            )
          ) {
            folderAttachment = attachment;
          }

        });


        var buttons = [];


        if (cutlistAttachment) {

          buttons.push({
            text: 'SM Cutlist',
            condition: 'always',
            url: cutlistAttachment.url,
            target: '_blank'
          });

        }


        if (folderAttachment) {

          buttons.push({
            text: 'Project Folder',
            condition: 'always',
            url: folderAttachment.url,
            target: '_blank'
          });

        }


        return buttons;

      });

  }

});
</script>

</body>
</html>
