<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MYKM Project Tools</title>
</head>

<body>

<script src="https://p.trellocdn.com/power-up.min.js"></script>

<script>
window.TrelloPowerUp.initialize({

  'card-buttons': function(t, options) {

    return [{
      text: 'MYKM TEST',
      condition: 'always',

      callback: function(t) {
        return t.alert({
          message: 'MYKM Project Tools is working!'
        });
      }
    }];

  },

  'show-settings': function(t, options) {

    return t.popup({
      title: 'MYKM Project Tools Settings',
      url: './settings.html',
      height: 500
    });

  }

});
</script>

</body>
</html>
