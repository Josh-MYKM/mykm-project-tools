<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MYKM Project Tools Settings</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      color: #172b4d;
    }

    h2 {
      margin-top: 0;
    }

    button {
      padding: 10px 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>MYKM Project Tools</h2>

<p>
  Power-Up settings are loading correctly.
</p>

<button id="close">
  Close
</button>

<script src="https://p.trellocdn.com/power-up.min.js"></script>

<script>
const t = window.TrelloPowerUp.iframe();

document
  .getElementById('close')
  .addEventListener('click', function() {
    t.closePopup();
  });
</script>

</body>
</html>
